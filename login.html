<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d14">
    <title>Sign in — OmniThread</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="auth-page" data-theme="dark">
    <div class="ambient-glow bg-glow-1"></div>
    <div class="ambient-glow bg-glow-2"></div>
    <header class="auth-header">
        <a class="brand auth-brand" href="index.html">
            <span class="brand-icon"><i class="fa-solid fa-comments"></i></span>
            <span class="brand-text"><strong>OmniThread</strong><span class="badge badge-pro">Multilingual</span></span>
        </a>
        <a class="auth-back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to discussion</a>
    </header>
    <main class="auth-main">
        <section class="auth-card glass-card" aria-labelledby="loginTitle">
            <div class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
            <p class="auth-eyebrow">WELCOME BACK</p>
            <h1 id="loginTitle">Sign in to OmniThread</h1>
            <p class="auth-subtitle">Join the conversation in any language.</p>
            <form id="loginForm" class="auth-form">
                <label for="loginEmail">Email address</label>
                <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                <label for="loginPassword">Password</label>
                <div class="auth-password-field">
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Enter your password" required>
                    <button class="password-toggle" type="button" data-toggle-password="loginPassword" aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye"></i><span>Show</span></button>
                </div>
                <button class="btn btn-primary auth-submit" type="submit">Sign in <i class="fa-solid fa-arrow-right"></i></button>
                <p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-switch">New to OmniThread? <a href="register.html">Create an account</a></p>
            <p class="auth-demo-note"><i class="fa-solid fa-circle-info"></i> Demo accounts are stored in this browser only. This is not server-side authentication.</p>
        </section>
    </main>
    <script src="static/js/auth.js"></script>
</body>
</html>
